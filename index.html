<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tizimga kirish</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="gpaclass">Tizimga kirish</h1>

  <form id="loginForm">
    <input type="text" id="login" placeholder="Login" required />
    <input type="password" id="password" placeholder="Parol" required />
    <button type="submit">Kirish</button>
  </form>

  <p>Yangi foydalanuvchimisiz? <a href="register.html">Ro‘yxatdan o‘ting</a></p>
  <p>Parolni unutdingizmi? <a href="register.html">Qayta ro‘yxatdan o‘ting</a></p>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const login = document.getElementById("login").value.trim();
      const password = document.getElementById("password").value.trim();

      const savedLogin = localStorage.getItem("userLogin");
      const savedPassword = localStorage.getItem("userPassword");

      if (login === savedLogin && password === savedPassword) {
        window.location.href = "home.html";
      } else {
        alert("Login yoki parol noto‘g‘ri!");
      }
    });
  </script>
</body>
</html>
